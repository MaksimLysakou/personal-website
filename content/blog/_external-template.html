<!--
  Скопируйте в content/blog/my-external-article.html.
  Укажите заголовок, краткое описание, дату оригинальной публикации и URL.
  Сохраните обложку в img/blog/ и заполните data-cover и data-cover-alt.
  data-source — название площадки (необязательно; по умолчанию домен ссылки).
  Для публикации замените data-status="draft" на "published".
  Тело статьи не требуется. Обложка и заголовок ведут прямо на внешний сайт.
-->
<article
  data-type="external"
  data-url="https://fively.dev/expertise/article-slug/"
  data-source="Fively"
  data-title="Заголовок внешней статьи"
  data-description="Краткое описание для карточки в блоге."
  data-date="2026-09-21"
  data-status="draft"
  data-tags="Engineering, AI"
  data-cover="/img/blog/external-article.png"
  data-cover-alt="Описание обложки статьи"
  lang="en"
></article>
